<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>위시 등록</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>위시 등록</h1>
    <input type="text" id="name" placeholder="상품 이름">
    <input type="text" id="category" placeholder="카테고리">
    <input type="text" id="shop_name" placeholder="쇼핑몰명">
    <input type="number" id="total_length_cm" placeholder="총장(cm)">
    <input type="number" id="shoulder_cm" placeholder="어깨(cm)">
    <input type="number" id="chest_cm" placeholder="가슴(cm)">
    <input type="number" id="sleeve_cm" placeholder="소매(cm)">
    <input type="number" id="waist_cm" placeholder="허리(cm)">
    <input type="number" id="hip_cm" placeholder="엉덩이(cm)">

    <select id="unit-select">
        <option value="cm">cm</option>
        <option value="inch">inch</option>
    </select>

    <button id="register-btn">등록</button>
    <p id="message"></p>
    <button id="main-btn">메인으로</button>

    <script src="wishlist.js"></script>
    
</body>
</html>
